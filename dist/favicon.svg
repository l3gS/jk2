<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0812"/>
      <stop offset="100%" stop-color="#0a0408"/>
    </radialGradient>
    <radialGradient id="hg" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff9fd5"/>
      <stop offset="50%" stop-color="#ff3ea5"/>
      <stop offset="100%" stop-color="#c91e7e"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Dark background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- Pink heart -->
  <path filter="url(#glow)"
    d="M16 25 C16 25 5 18 5 11.5 C5 8 7.5 6 10.5 6 C13 6 15 7.5 16 9 C17 7.5 19 6 21.5 6 C24.5 6 27 8 27 11.5 C27 18 16 25 16 25Z"
    fill="url(#hg)" opacity="0.97"/>
  <!-- Sparkle -->
  <circle cx="12" cy="10" r="1.2" fill="white" opacity="0.7"/>
</svg>
